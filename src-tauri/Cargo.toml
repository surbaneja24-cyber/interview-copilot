[package]
name = "interview-copilot"
version = "0.0.1"
description = "Copiloto de entrevistas local-first"
authors = ["Santiago Urbaneja"]
license = "MIT"
edition = "2021"
# Se usa `Option::is_none_or`, estable desde 1.82. La cifra anterior (1.77.2) era
# aspiracional: el crate no compilaba con ella. Clippy lo detecto.
rust-version = "1.82.0"

[lib]
name = "interview_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
fastembed = "4"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tauri-plugin-dialog = "2"

# Tauri ya arrastra reqwest 0.12 con TLS, asi que anadirlo no compila nada nuevo:
# es el mismo cliente HTTP que usan los tres providers de LLM (§18).
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "default-tls",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
# La clave de API no puede vivir en la base de datos (§31): va al almacen de
# credenciales del sistema, que en Windows es Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
# Captura de audio (§11). 0.17 y no 0.18 porque la 0.18 exige rustc 1.85 y este crate
# promete compilar con 1.82; prometer una version que no se ha probado ya salio mal una
# vez (ver ROADMAP, fase 0).
cpal = "0.17.3"

[target.'cfg(windows)'.dependencies]
# Misma version que ya arrastran Tauri y cpal, para no compilar dos copias del crate.
# Estaba en 0.57 y al entrar cpal aparecio una segunda copia; subirla exigio un cambio
# real, no cosmetico: en 0.61 `GetDesc1` devuelve el descriptor en vez de rellenar un
# parametro de salida. Queda una 0.57 en el arbol que no es nuestra, la de sysinfo.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
tempfile = "3"
# Solo para los tests async. Tauri ya compila tokio con estas mismas features.
tokio = { version = "1", features = ["macros", "rt"] }

[profile.dev]
# Con 5,7 GB de RAM utilizables, enlazar con debug info completo agota la memoria.
# 1 = solo tablas de linea: suficiente para un backtrace util y mucho mas barato.
debug = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
